<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghi Nhận Huyết Áp</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; text-align: center; font-size: 24px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; font-size: 32px; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; text-align: left; font-size: 26px; }
        input, select, textarea { width: 100%; padding: 15px; margin-top: 5px; box-sizing: border-box; border: 2px solid #ccc; border-radius: 10px; font-size: 26px; }
        .radio-group { display: flex; justify-content: space-between; margin-top: 10px; gap: 15px; }
        .radio-btn { flex: 1; padding: 20px; border: 3px solid #ccc; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 28px; background: #fff; transition: 0.2s; }
        .radio-btn.active { border-color: #007bff; background-color: #e6f2ff; color: #007bff; }
        button { width: 100%; padding: 20px; background-color: #28a745; color: white; border: none; border-radius: 12px; font-size: 30px; font-weight: bold; margin-top: 30px; cursor: pointer; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #message { margin-top: 20px; font-weight: bold; font-size: 26px; }
        
        /* Đèn báo trạng thái đồng bộ cho bạn dễ theo dõi */
        .sync-status { font-size: 18px; margin-top: 10px; color: #666; font-style: italic; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 16px; font-weight: bold; color: white; }
        .badge-waiting { background-color: #ff9800; }
        .badge-synced { background-color: #4caf50; }
    </style>
</head>
<body>

<div class="container">
    <h2>ỨNG DỤNG THEO DÕI HUYẾT ÁP</h2>
    
    <label>1. Người đo:</label>
    <div class="radio-group">
        <div class="radio-btn" id="btn-ong" onclick="selectUser('Ông')">ÔNG</div>
        <div class="radio-btn" id="btn-ba" onclick="selectUser('Bà')">BÀ</div>
    </div>

    <label style="margin-top:25px;">2. Ngày giờ đo:</label>
    <input type="datetime-local" id="ngayGio">

    <label>3. HA Tâm thu (Số trên):</label>
    <input type="number" id="tamThu" placeholder="Ví dụ: 120" inputmode="numeric">

    <label>4. HA Tâm trương (Số dưới):</label>
    <input type="number" id="tamTruong" placeholder="Ví dụ: 80" inputmode="numeric">

    <label>5. Nhịp tim:</label>
    <input type="number" id="nhipTim" placeholder="Ví dụ: 75" inputmode="numeric">

    <label>6. Ghi chú (Nếu có):</label>
    <textarea id="ghiChu" rows="2" placeholder="Mệt, sau đi bộ..."></textarea>

    <button id="btnSubmit" onclick="guiDuLieu()">BẤM ĐỂ LƯU SỐ ĐO</button>
    <div id="message"></div>
    <div class="sync-status" id="syncStatus">Đang kiểm tra kết nối...</div>
</div>

<script>
    // ĐỊNH CẤU HÌNH ĐƯỜNG LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPW1jvzhXLLctQvMMbnwguuU7vhumVX_eopVfIOi_x_Vy_VhxEvm7jIeOOvTZcucdz/exec";

    let nguoiDoSelected = "";
    let isSyncing = false; // Tránh việc đồng bộ lặp lại cùng lúc

    // Tự động điền ngày giờ hiện tại theo giờ Việt Nam khi mở app
    window.onload = function() {
        resetDateTime();
        updateSyncStatusUI();
        
        // Tự động kích hoạt đồng bộ ngay khi vừa mở app (nếu có mạng)
        if (navigator.onLine) {
            coGangDongBo();
        }
    };

    // Lắng nghe sự kiện điện thoại có mạng trở lại để tự sync luôn
    window.addEventListener('online', coGangDongBo);

    function resetDateTime() {
        const giờVN = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        document.getElementById('ngayGio').value = giờVN;
    }

    function selectUser(user) {
        nguoiDoSelected = user;
        document.getElementById('btn-ong').classList.remove('active');
        document.getElementById('btn-ba').classList.remove('active');
        if(user === 'Ông') document.getElementById('btn-ong').classList.add('active');
        if(user === 'Bà') document.getElementById('btn-ba').classList.add('active');
    }

    // Lấy danh sách số đo đang lưu tạm dưới máy
    function getStoredLogs() {
        const logs = localStorage.getItem('bloodPressureLogs');
        return logs ? JSON.parse(logs) : [];
    }

    // Lưu danh sách số đo tạm xuống máy
    function saveStoredLogs(logs) {
        localStorage.setItem('bloodPressureLogs', JSON.stringify(logs));
        updateSyncStatusUI();
    }

    // Cập nhật dòng chữ thông báo trạng thái hàng chờ lưu dưới máy
    function updateSyncStatusUI() {
        const logs = getStoredLogs();
        const statusDiv = document.getElementById('syncStatus');
        if (logs.length === 0) {
            statusDiv.innerHTML = 'Trạng thái: <span class="badge badge-synced">Đã đồng bộ hết</span>';
        } else {
            statusDiv.innerHTML = `Trạng thái: <span class="badge badge-waiting">Chờ gửi lên mạng: ${logs.length} số đo</span>`;
        }
    }

    // BƯỚC LƯU NHANH (OFFLINE FIRST)
    function guiDuLieu() {
        const ngayGioRaw = document.getElementById('ngayGio').value;
        const tamThu = document.getElementById('tamThu').value;
        const tamTruong = document.getElementById('tamTruong').value;
        const nhipTim = document.getElementById('nhipTim').value;
        const ghiChu = document.getElementById('ghiChu').value;
        const msg = document.getElementById('message');

        if (!nguoiDoSelected) { alert("Xin vui lòng bấm chọn người đo (Ông hoặc Bà)!"); return; }
        if (!ngayGioRaw || !tamThu || !tamTruong || !nhipTim) { alert("Xin vui lòng điền đầy đủ các thông số đo!"); return; }

        const d = new Date(ngayGioRaw);
        const ngayGioFormatted = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

        // Tạo gói dữ liệu số đo mới
        const newPayload = {
            ngayGio: ngayGioFormatted,
            nguoiDo: nguoiDoSelected,
            tamThu: Number(tamThu),
            tamTruong: Number(tamTruong),
            nhipTim: Number(nhipTim),
            ghiChu: ghiChu
        };

        // Ghi thẳng vào bộ nhớ máy (LocalStorage)
        const currentLogs = getStoredLogs();
        currentLogs.push(newPayload);
        saveStoredLogs(currentLogs);

        // Báo thành công ngay lập tức cho ông bà (0 giây trễ)
        msg.style.color = "green";
        msg.innerText = "LƯU THÀNH CÔNG! Đã ghi nhớ số đo.";

        // Reset lại form nhập liệu
        document.getElementById('tamThu').value = '';
        document.getElementById('tamTruong').value = '';
        document.getElementById('nhipTim').value = '';
        document.getElementById('ghiChu').value = '';
        resetDateTime();

        // Kích hoạt tiến trình gửi lên Google Sheets ngầm ở dưới nền
        coGangDongBo();
    }

    // TIẾN TRÌNH ĐỒNG BỘ NGẦM (BACKGROUND SYNC)
    function coGangDongBo() {
        if (isSyncing) return;
        const logs = getStoredLogs();
        if (logs.length === 0) return; // Không có gì để gửi

        isSyncing = true;
        const statusDiv = document.getElementById('syncStatus');
        statusDiv.innerHTML = `Đang tự động gửi số liệu lên Google Sheet...`;

        // Lấy số đo đầu tiên trong hàng chờ ra để gửi
        const logToSync = logs[0];

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(logToSync)
        })
        .then(response => response.json())
        .then(data => {
            if (data.result === "success") {
                // Gửi thành công, xóa số đo này khỏi hàng chờ dưới máy
                const currentLogs = getStoredLogs();
                currentLogs.shift(); // Xóa phần tử đầu tiên
                saveStoredLogs(currentLogs);

                // ĐỢI 5 GIÂY CHO GOOGLE SHEETS CẬP NHẬT RỒI NẠP LẠI CẢ 2 KHUNG LỊCH SỬ
                setTimeout(function() {
                    const iframeBa = document.getElementById('khungLichSuBa');
                    const iframeOng = document.getElementById('khungLichSuOng');
                    
                    if (iframeBa) {
                        let srcBa = iframeBa.src.split('&cache_bypass=')[0];
                        iframeBa.src = srcBa + '&cache_bypass=' + new Date().getTime();
                    }
                    if (iframeOng) {
                        let srcOng = iframeOng.src.split('&cache_bypass=')[0];
                        iframeOng.src = srcOng + '&cache_bypass=' + new Date().getTime();
                    }
                }, 5000);

                isSyncing = false;
                // Tiếp tục gọi đệ quy để gửi số đo tiếp theo nếu còn trong hàng chờ
                coGangDongBo();
            } else {
                isSyncing = false;
                updateSyncStatusUI();
            }
        })
        .catch(error => {
            // Mất mạng hoặc lỗi kết nối, tạm dừng đồng bộ và đợi lần sau
            isSyncing = false;
            updateSyncStatusUI();
        });
    }
</script>

<!-- PHẦN LỊCH SỬ SỐ ĐO (2 KHUNG RIÊNG BIỆT) -->
<div style="max-width: 500px; margin: 20px auto; padding: 10px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden;">
    <h3 style="font-size: 26px; color: #d9534f; margin-bottom: 10px;">LỊCH SỬ SỐ ĐO CỦA BÀ</h3>
    <iframe id="khungLichSuBa" src="<iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSxh_9OFz3fAEh3MZEeHQJYx7Pi2oCck5SQjuYwwiB5BBqPl2eU5gA7UfGFmj6oGGS9-RH8JwmGOXVd/pubhtml?gid=2058604513&amp;single=true&amp;widget=true&amp;headers=false"></iframe>" width="100%" height="300" style="border: none; border-radius: 10px;"></iframe>
</div>

<div style="max-width: 500px; margin: 20px auto; padding: 10px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden;">
    <h3 style="font-size: 26px; color: #0275d8; margin-bottom: 10px;">LỊCH SỬ SỐ ĐO CỦA ÔNG</h3>
    <iframe id="khungLichSuOng" src="<iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSxh_9OFz3fAEh3MZEeHQJYx7Pi2oCck5SQjuYwwiB5BBqPl2eU5gA7UfGFmj6oGGS9-RH8JwmGOXVd/pubhtml?gid=1865428434&amp;single=true&amp;widget=true&amp;headers=false"></iframe>" width="100%" height="300" style="border: none; border-radius: 10px;"></iframe>
</div>

</body>
</html>
